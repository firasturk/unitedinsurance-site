<!doctype html>
<html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><link rel="icon" href="/favicon.ico">
<style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style>
<title>Medical Network — United Insurance</title>
<meta name="description" content="ابحث عن الأطباء والمستشفيات والمختبرات والصيدليات ضمن الشبكة الطبية لشركة نات هيلث المعتمدة لمؤمني الشركة المتحدة للتأمين في كل محافظات المملكة.">
<link rel="alternate" hreflang="ar" href="https://unitedjo.com/medical-network"><link rel="alternate" hreflang="en" href="https://unitedjo.com/en/medical-network">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap">
<style>
/* Layout: brand navy band with the search panel overlapping it, then a filter rail + result cards — matches unitedjo.com */
:root{
  --bg:#f5f7fb; --surface:#ffffff; --line:#e3e8f2; --fg:#0f1a33; --muted:#5b6782;
  --navy:#0e1f4d; --navy-deep:#09143a; --royal:#2f55d4; --royal-soft:#e9eefc; --ok:#0f9d6b;
  --chip:#eef1f8; --shadow:0 1px 2px rgba(14,31,77,.06),0 8px 24px rgba(14,31,77,.06);
  --f-ar:"Cairo",system-ui,sans-serif; --f-en:"Inter",system-ui,sans-serif; --f-display:"Poppins","Cairo",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b1122; --surface:#121a31; --line:#232e4d; --fg:#e8ecf7; --muted:#9aa6c4;
  --navy:#101c40; --navy-deep:#0a1230; --royal:#7b97ff; --royal-soft:#1c2850; --ok:#3ccf98; --chip:#1a2442;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1122; --surface:#121a31; --line:#232e4d; --fg:#e8ecf7; --muted:#9aa6c4;
  --navy:#101c40; --navy-deep:#0a1230; --royal:#7b97ff; --royal-soft:#1c2850; --ok:#3ccf98; --chip:#1a2442;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
html,body{overflow-x:clip}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ar);font-size:15px;line-height:1.6}
html[lang="en"] body{font-family:var(--f-en)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--royal);outline-offset:2px}

.hero{background:radial-gradient(120% 140% at 85% 0%,#1d3a8f 0%,transparent 55%),linear-gradient(180deg,var(--navy),var(--navy-deep));color:#fff}
.hero .wrap{padding-block:22px 92px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{font-size:13px;letter-spacing:.04em;opacity:.8}
.lang{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);color:#fff;border-radius:999px;padding:6px 14px;cursor:pointer;font-size:13px}
.lang:hover{background:rgba(255,255,255,.2)}
h1{font-family:var(--f-display);font-size:clamp(30px,5vw,46px);line-height:1.15;margin:22px 0 8px;text-wrap:balance}
html[lang="ar"] h1{font-family:var(--f-ar);font-weight:800}
.sub{opacity:.82;margin:0;max-width:60ch}
.stats{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.stat{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);border-radius:999px;padding:4px 12px;font-size:13px;font-variant-numeric:tabular-nums}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);margin-top:-64px;padding:18px;position:relative}
.tabs{display:inline-flex;background:var(--chip);border-radius:14px;padding:4px;gap:4px;flex-wrap:wrap}
.tab{border:0;background:transparent;border-radius:11px;padding:9px 16px;cursor:pointer;font-weight:600;color:var(--muted);display:flex;gap:8px;align-items:center}
.tab[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(14,31,77,.12)}
.tab .n{font-size:12px;font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums}
.searchrow{display:grid;grid-template-columns:1fr;gap:10px;margin-top:14px}
@media(min-width:760px){.searchrow{grid-template-columns:minmax(0,2fr) minmax(0,1fr) minmax(0,1fr)}}
.field{position:relative;min-width:0}
.field svg{position:absolute;inset-inline-start:14px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.search{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:14px;padding:12px 14px;padding-inline-start:42px;font-size:15px}
select{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:14px;padding:12px 14px;cursor:pointer;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 20px) 55%,calc(100% - 15px) 55%;background-size:5px 5px;background-repeat:no-repeat}
html[dir="rtl"] select{background-position:20px 55%,25px 55%}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;cursor:pointer;font-size:14px;display:flex;align-items:center;gap:7px;color:var(--fg)}
.chip:hover{border-color:var(--royal)}
.chip[aria-pressed="true"]{background:var(--royal);border-color:var(--royal);color:#fff}
.chip .c{font-size:12px;opacity:.7;font-variant-numeric:tabular-nums}
.specrow{margin-top:12px;max-width:360px}

.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:26px 0 12px}
.count{font-weight:600}
.count b{color:var(--royal);font-variant-numeric:tabular-nums}
.reset{border:0;background:none;color:var(--royal);cursor:pointer;font-weight:600;padding:4px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0;transition:border-color .2s,box-shadow .2s}
.card:hover{border-color:color-mix(in oklab,var(--royal) 40%,var(--line));box-shadow:var(--shadow)}
.head{display:flex;gap:12px;align-items:flex-start}
.ico{flex:none;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--royal-soft);color:var(--royal)}
.name{font-weight:700;font-size:16px;line-height:1.35;margin:0;overflow-wrap:anywhere}
.kind{font-size:13px;color:var(--royal);font-weight:600}
.loc{display:flex;gap:8px;font-size:13.5px;color:var(--muted);align-items:flex-start}
.loc svg{flex:none;margin-top:3px}
.loc .area{color:var(--fg);font-weight:600}
.phone{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:8px;border-top:1px dashed var(--line);padding-top:10px}
.num{font-family:var(--f-en);font-variant-numeric:tabular-nums;direction:ltr;font-weight:600;letter-spacing:.02em;user-select:all}
.acts{display:flex;gap:6px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 11px;cursor:pointer;font-size:13px;display:flex;gap:6px;align-items:center;text-decoration:none;color:var(--fg)}
.btn.call{background:var(--royal);border-color:var(--royal);color:#fff}
.btn:hover{filter:brightness(1.05)}
.nophone{font-size:13px;color:var(--muted)}
.more{display:flex;justify-content:center;margin:24px 0 8px}
.more button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:11px 26px;cursor:pointer;font-weight:600}
.empty{text-align:center;padding:48px 16px;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:18px}
.empty b{display:block;color:var(--fg);font-size:17px;margin-bottom:4px}
.note{font-size:13px;color:var(--muted);text-align:center;padding-block:28px 40px}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}

/* ===== design switcher ===== */
.switch{position:fixed;z-index:20;bottom:calc(16px + env(safe-area-inset-bottom,0px));inset-inline-start:max(16px,env(safe-area-inset-left,0px));display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px;box-shadow:var(--shadow)}
.switch span{font-size:12px;color:var(--muted);padding:6px 8px 6px 10px}
.switch button{border:0;background:transparent;border-radius:999px;padding:6px 12px;cursor:pointer;font-weight:600;font-size:13px;color:var(--muted)}
.switch button[aria-pressed="true"]{background:var(--royal);color:#fff}
.tiles{display:none}

/* ---- B: side filters + compact list ---- */
@media(min-width:960px){
 .v-b main.wrap{display:grid;grid-template-columns:330px minmax(0,1fr);gap:24px;align-items:start}
 .v-b .panel{position:sticky;top:16px;margin-top:-64px}
 .v-b .searchrow{grid-template-columns:1fr}
 .v-b .chips{flex-direction:column;align-items:stretch}
 .v-b .chip{justify-content:space-between;border-radius:12px}
 .v-b .specrow{max-width:none}
 .v-b #results{padding-top:0}
 .v-b .bar{margin-top:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 16px}
}
.v-b .grid{grid-template-columns:1fr;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.v-b .card{border:0;border-radius:0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) auto;align-items:center;gap:16px;padding:14px 18px}
.v-b .card:hover{box-shadow:none;background:var(--bg)}
.v-b .phone{border:0;padding:0;margin:0;flex-direction:column;align-items:flex-end;gap:6px}
.v-b .ico{width:36px;height:36px;border-radius:10px}
.v-b .name{font-size:15px}
@media(max-width:700px){.v-b .card{grid-template-columns:1fr}.v-b .phone{flex-direction:row;align-items:center;border-top:1px dashed var(--line);padding-top:10px}}

/* ---- C: light header, governorate tiles, cards with a type stripe ---- */
.v-c .hero{background:var(--bg);color:var(--fg)}
.v-c .hero .wrap{padding-block:32px 24px}
.v-c .brand{color:var(--royal);opacity:1;font-weight:700}
.v-c .lang{background:var(--surface);color:var(--fg);border-color:var(--line)}
.v-c .sub{color:var(--muted);opacity:1}
.v-c .stat{background:var(--surface);border-color:var(--line);color:var(--muted)}
.v-c .panel{margin-top:0;background:var(--navy);border-color:var(--navy);color:#fff}
.v-c .panel .tabs{background:rgba(255,255,255,.1)}
.v-c .panel .tab{color:rgba(255,255,255,.75)}
.v-c .panel .tab[aria-selected="true"]{background:#fff;color:#0f1a33}
.v-c .panel .tab[aria-selected="true"] .n{color:#5b6782}
.v-c .panel .tab .n{color:rgba(255,255,255,.6)}
.v-c .panel .search,.v-c .panel select{background-color:#fff;color:#0f1a33;border-color:transparent}
.v-c .panel .chip{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.18);color:#fff}
.v-c .panel .chip[aria-pressed="true"]{background:#fff;color:#0f1a33;border-color:#fff}
.v-c .tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr));gap:10px;margin-top:22px}
.tile{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:14px;cursor:pointer;text-align:start;display:flex;flex-direction:column;gap:2px}
.tile b{font-size:16px}
.tile span{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.tile:hover{border-color:var(--royal)}
.tile[aria-pressed="true"]{background:var(--royal);border-color:var(--royal);color:#fff}
.tile[aria-pressed="true"] span{color:rgba(255,255,255,.8)}
.v-c .card{border-radius:16px;border-top:4px solid var(--stripe,var(--royal))}
.v-c .ico{background:transparent;border:1px solid var(--line);color:var(--stripe,var(--royal))}
.v-c .kind{color:var(--stripe,var(--royal))}

/* ===== Jordan map in the header ===== */
.hero-grid{display:grid;gap:8px;align-items:center}
@media(min-width:860px){.hero-grid{grid-template-columns:minmax(0,.9fr) minmax(0,1.3fr);gap:24px}}
.map{position:relative;max-width:100%;--pin:#8fb0ff}
.map svg{display:block;width:100%;height:auto;overflow:visible}
.mapbox{max-width:640px;margin-inline:auto}
@media(max-width:859px){.mapbox{max-width:520px}}
.land{fill:currentColor;fill-opacity:.07;stroke:currentColor;stroke-opacity:.45;stroke-width:1.4;stroke-linejoin:round}
.grid-dots{fill:currentColor;opacity:.12}
.pin{cursor:pointer;outline:none}
.pin .dot{fill:var(--pin);stroke:#fff;stroke-width:1.6;transition:r .2s}
.pin .ring{fill:none;stroke:var(--pin);stroke-width:1.6;transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-out infinite}
.mapbox{position:relative}
.pin .hit{fill:transparent}
.lead{fill:none;stroke:currentColor;stroke-opacity:.3;stroke-width:1;transition:stroke-opacity .2s}
.lead.on{stroke:var(--pin);stroke-opacity:1;stroke-width:1.6}
.mlabel{position:absolute;transform:translate(-100%,-50%);display:flex;align-items:baseline;gap:6px;white-space:nowrap;border:0;background:transparent;color:inherit;cursor:pointer;padding:3px 8px;border-radius:999px;font-family:inherit;line-height:1.2;transition:background .2s,color .2s,font-size .2s}
.mlabel.e{transform:translate(0,-50%)}
html[dir="rtl"] .mlabel.e{flex-direction:row-reverse}
.mlabel b{font-size:clamp(13px,1.35vw,16px);font-weight:700}
.mlabel span{font-size:clamp(11px,1vw,13px);opacity:.65;font-variant-numeric:tabular-nums}
.mlabel:hover{background:rgba(255,255,255,.1)}
.mlabel.on{background:var(--pin);color:var(--navy-deep)}
.mlabel.on b{font-size:clamp(16px,1.8vw,21px);font-weight:800}
.mlabel.on span{opacity:.85}
.map.has-on .mlabel:not(.on){opacity:.5}
.map.has-on .mlabel:not(.on):hover{opacity:1}
.v-c .mlabel:hover{background:var(--chip)}
.v-c .mlabel.on{color:#fff}
.pin .dot{fill:#fff;stroke:var(--pin);stroke-width:1.6}
.pin .emb{fill:#14286b;pointer-events:none}
.pin:hover .dot{stroke-width:2.6}
.pin.on .emb{fill:#fff}
.pin.on .dot{fill:#2f55d4;stroke:#fff;stroke-width:2.4}
.map.has-on .pin:not(.on) .ring{animation:none;opacity:0}
.maphint{font-size:12.5px;opacity:.7;text-align:center;margin-top:4px}
@keyframes pulse{0%{transform:scale(1);opacity:.85}80%,100%{transform:scale(3.2);opacity:0}}
.v-c .map{--pin:var(--royal)}

@media (prefers-reduced-motion:reduce){.pin .ring{animation:none;opacity:.35}}

/* selected governorate: larger name */

/* opening animation: the map starts large in the middle of the screen, pins pop in, then it settles into the header */


/* ===== two scenes: 1) full-screen map, 2) information page ===== */
.scene1{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;gap:6px;
  background:radial-gradient(90% 70% at 70% 0%,#1d3a8f 0%,transparent 60%),linear-gradient(180deg,var(--navy),var(--navy-deep));color:#fff;
  padding-block:18px 22px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.s1top{width:100%;max-width:1180px;display:flex;justify-content:space-between;align-items:center}
.s1head{text-align:center;margin-top:6px}
.s1head h1{margin:6px 0 4px}
.s1sub{margin:0;opacity:.75;font-size:15px}
.scene1 .map{flex:1;width:100%;display:flex;flex-direction:column;justify-content:flex-start;padding-top:clamp(8px,2vh,20px)}
.scene1 .mapbox{width:min(100%,980px,calc((100dvh - 350px) * 1.55));max-width:none}
.allbtn{border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#fff;border-radius:999px;padding:10px 22px;cursor:pointer;font-weight:600}
.allbtn:hover{background:rgba(255,255,255,.16)}
.scene1.leave{animation:sceneOut .5s ease forwards}
#scene2.enter{animation:fadeUp .55s ease both}
@keyframes sceneOut{to{opacity:0;transform:scale(.97)}}
.back{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);color:#fff;border-radius:999px;padding:7px 14px;cursor:pointer;font-size:14px;font-weight:600}
.back:hover{background:rgba(255,255,255,.2)}
.s2title{font-family:var(--f-display);font-size:clamp(28px,4.5vw,42px);line-height:1.15;margin:20px 0 6px}
html[lang="ar"] .s2title{font-family:var(--f-ar);font-weight:800}
.mlabel b{font-size:clamp(14px,1.6vw,18px)}
.mlabel span{font-size:clamp(11px,1.1vw,13px)}
.lead{stroke-opacity:.32;stroke-width:1.1;stroke-dasharray:none;stroke-linecap:round}
.lead.on,.pin:hover~.lead{stroke-dasharray:none}
.lend{fill:currentColor;opacity:.55}
@media(max-width:600px){.mlabel{padding:3px 4px}.mlabel b{font-size:13px}}
.map.intro .land{stroke-dasharray:2600;stroke-dashoffset:2600;fill-opacity:0;animation:drawIn 3.2s cubic-bezier(.45,0,.2,1) .3s forwards,fillIn .9s ease 3.1s forwards}
.map.intro .grid-dots{opacity:0;animation:dotsIn 1s ease 2.8s forwards}
.map.intro .pin{opacity:0;animation:popIn .5s cubic-bezier(.3,1.6,.5,1) forwards;transform-box:fill-box;transform-origin:center}
.map.intro .lead,.map.intro .lend,.map.intro .mlabel{opacity:0;animation:fadeIn .6s ease forwards}
.s1head,.allbtn,.s1top{animation:fadeIn .8s ease both}
.allbtn{animation-delay:4.4s}
@keyframes drawIn{to{stroke-dashoffset:0}}
@keyframes fillIn{to{fill-opacity:.07}}
@keyframes dotsIn{to{opacity:.12}}
@keyframes popIn{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.map.intro *,.scene1 *,.scene1.leave,#scene2.enter{animation:none!important;opacity:1!important;stroke-dasharray:none!important}}

/* ===== weather card (scene 2) ===== */
.s2row{display:flex;gap:16px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap}
.s2main{min-width:0;flex:1 1 320px}
.wx{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);border-radius:18px;padding:10px 16px 10px 12px;animation:fadeUp .6s ease .25s both}
.wx svg{width:54px;height:54px;flex:none;overflow:visible}
.wx .t{font-family:var(--f-en);font-size:30px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.wx .d{font-size:13px;opacity:.8;margin-top:4px}
.wx .hl{font-size:12px;opacity:.6;font-variant-numeric:tabular-nums}
.wx .sun{fill:#ffcf5a}.wx .rays{stroke:#ffcf5a;stroke-width:3;stroke-linecap:round;transform-origin:24px 24px;animation:spin 14s linear infinite}
.wx .moon{fill:#dfe6ff}
.wx .cloud{fill:#e8eefc;animation:drift 5s ease-in-out infinite alternate}
.wx .cloud2{fill:#b9c6e8;animation:drift 6s ease-in-out infinite alternate-reverse}
.wx .drop{stroke:#8fb0ff;stroke-width:2.6;stroke-linecap:round;animation:fall 1s linear infinite}
.wx .flake{fill:#fff;animation:fall 2.2s linear infinite}
.wx .bolt{fill:#ffcf5a;animation:flash 2.6s steps(1) infinite}
.wx .fog{stroke:#c9d4f0;stroke-width:3;stroke-linecap:round;animation:drift 3s ease-in-out infinite alternate}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes drift{from{transform:translateX(-2px)}to{transform:translateX(3px)}}
@keyframes fall{from{transform:translateY(-4px);opacity:0}30%{opacity:1}to{transform:translateY(8px);opacity:0}}
@keyframes flash{0%,100%{opacity:0}8%,14%{opacity:1}11%{opacity:.2}}
@media (prefers-reduced-motion:reduce){.wx *{animation:none!important}}

/* scene 1: provider counter + weather beside each governorate */
.s1count{margin-top:clamp(28px,5vh,56px);font-size:17px;font-weight:700;opacity:0;animation:fadeIn .6s ease 3.3s forwards;display:flex;flex-direction:column;align-items:center;gap:2px}
.s1count b{font-family:var(--f-ar);font-size:clamp(32px,4.5vw,46px);font-weight:800;line-height:1.1;color:#8fb0ff;font-variant-numeric:tabular-nums}
.s1count span{opacity:.9;font-weight:700}

<script>
(async function(){

 ["all","الكل","All"],["doctor","الأطباء","Doctors"],["hospital","المستشفيات","Hospitals"],["emergency","الطوارئ","Emergency"],

const STRIPE={doctor:'#2f55d4',hospital:'#c2410c',emergency:'#dc2626',lab:'#7c3aed',radiology:'#0891b2',physio:'#0f9d6b',optical:'#b45309',center:'#db2777',supplier:'#64748b',pharmacy:'#0f9d6b'};

const T={
 ar:{brand:"المتحدة للتأمين",title:"الشبكة الطبية",sub:"ابحث عن الأطباء والمستشفيات والمختبرات والصيدليات ضمن الشبكة الطبية لشركة نات هيلث (NatHealth)، المعتمدة لخدمة مؤمني الشركة المتحدة للتأمين في مختلف محافظات المملكة.",

 en:{brand:"United Insurance",title:"Medical Network",sub:"Find doctors, hospitals, laboratories, and pharmacies within the NatHealth medical network, approved to serve United Insurance Company’s insured members across all governorates of Jordan.",
   tabMed:"Doctors & centers",tabPh:"Pharmacies",q:"Search by name, specialty or area",qPh:"Search by pharmacy name or area",

});
const S={v:"a",lang:"ar",tab:"med",group:"all",city:-1,area:-1,spec:-1,q:"",shown:30};

function base(skip){ // rows matching every filter except `skip`
  const qs=S.q?norm(S.q).split(" "):[];
  return rows.filter(r=>inTab(r)
    &&(skip==="group"||S.group==="all"||S.tab==="ph"||r.g===S.group)

function count(list,f){const m=new Map();for(const r of list){const k=f(r);m.set(k,(m.get(k)||0)+1)}return m}

function card(r){

function renderQuick(){

function wxIcon(k){

  const moon=`<path class="moon" d="M30 10a14 14 0 1 0 8 22 11 11 0 1 1-8-22z"/>`;
  switch(k){
    case "sun":return `<svg viewBox="0 0 48 48">${sun}</svg>`;
    case "moon":return `<svg viewBox="0 0 48 48">${moon}</svg>`;
    case "partly":return `<svg viewBox="0 0 48 48"><g transform="translate(-6 -6) scale(.8)">${sun}</g>${cloud}</svg>`;

// first view: the map draws itself, pins pop in north to south, then names
(function intro(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const m=$("map"); m.classList.add("intro");
  const pins=[...m.querySelectorAll(".pin")].sort((x,y)=>x.querySelector(".dot").cy.baseVal.value-y.querySelector(".dot").cy.baseVal.value);
  pins.forEach((p,k)=>p.style.animationDelay=(2.6+k*.09)+"s");
  m.querySelectorAll(".lead,.lend").forEach((l,k)=>l.style.animationDelay=(3.5+k*.025)+"s");
  m.querySelectorAll(".mlabel").forEach((l,k)=>l.style.animationDelay=(3.6+k*.05)+"s");
  setTimeout(()=>m.classList.remove("intro"),5200);
})();
})();
